version: "3.8"

services:
  crud-golang:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - MONGODB_URL=mongodb://mongodb:27017
      - MONGODB_USER_DB=users
      - JWT_SECRET=sua_chave_secreta_jwt_super_segura
    depends_on:
      - mongodb
    networks:
      - crud-network

  mongodb:
    image: mongo:6.0
    container_name: mongodb
    ports:
      - "27017:27017"
    networks:
      - crud-network

networks:
  crud-network:
    driver: bridge
